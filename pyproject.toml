[project]
name = "artian-reroll"
version = "0.3.0"
description = "Local tracker for Monster Hunter Wilds Artian weapon reroll tables."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "PyInstaller>=6.6",
    "qtawesome>=1.3",
]

[project.scripts]
artian-reroll = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
