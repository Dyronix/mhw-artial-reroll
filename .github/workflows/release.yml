name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  package:
    name: Test + Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      APP_NAME: MHWildsGogmaziosTracker
      PYTHON_VERSION: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest
          else
            echo "No tests directory present; skipping pytest."
          fi

      - name: Build app (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --name "$APP_NAME" \
            --windowed \
            --paths src \
            --add-data "data:./data" \
            --add-data "assets:./assets" \
            src/main.py

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --name "$env:APP_NAME" `
            --windowed `
            --paths src `
            --add-data "data;data" `
            --add-data "assets;assets" `
            src/main.py

      - name: Package app (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            asset="mhwilds-gogmazios-tracker-macos-${tag}.zip"
            zip -r "${asset}" "dist/${APP_NAME}.app"
          else
            asset="mhwilds-gogmazios-tracker-linux-${tag}.zip"
            zip -r "${asset}" "dist/${APP_NAME}"
          fi
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Package app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "mhwilds-gogmazios-tracker-windows-$tag.zip"
          Compress-Archive -Path "dist\$env:APP_NAME" -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        run: |
          git archive --format=zip --output "mhwilds-gogmazios-tracker-source-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mhwilds-gogmazios-tracker-source-${{ github.ref_name }}.zip
            dist-artifacts/**/*.zip
